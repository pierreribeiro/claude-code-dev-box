---
# Python Ecosystem Installation
# Components: Python 3.12 + uv package manager
# Version: 1.0.0

- name: Check if Python {{ python_version }} is already installed via Homebrew
  ansible.builtin.command: "{{ homebrew_bin }}/brew list {{ python_package }}"
  register: python_check
  failed_when: false
  changed_when: false
  become: false

- name: Install Python {{ python_version }} via Homebrew
  community.general.homebrew:
    name: "{{ python_package }}"
    state: present
  when: python_check.rc != 0
  become: false

- name: Verify Python installation
  ansible.builtin.command: python3 --version
  register: python_version_check
  changed_when: false
  failed_when: false
  become: false

- name: Display Python version
  ansible.builtin.debug:
    msg: "Python installed: {{ python_version_check.stdout }}"
  when: python_version_check.rc == 0

# uv Package Manager Installation
- name: Check if uv is already installed via Homebrew
  ansible.builtin.command: "{{ homebrew_bin }}/brew list {{ uv_package }}"
  register: uv_check
  failed_when: false
  changed_when: false
  become: false

- name: Install uv package manager via Homebrew
  community.general.homebrew:
    name: "{{ uv_package }}"
    state: present
  when: uv_check.rc != 0
  become: false

# Shell Configuration for uv
- name: Ensure uv bin directory exists
  ansible.builtin.file:
    path: "{{ uv_bin_path }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: "0755"
  become: false

- name: Configure uv PATH in shell
  ansible.builtin.lineinfile:
    path: "{{ shell_config_file }}"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    create: true
    state: present
  become: false

- name: Verify uv installation
  ansible.builtin.shell: |
    {{ homebrew_bin }}/brew shellenv
    export PATH="$HOME/.local/bin:$PATH"
    uv --version
  register: uv_version_check
  changed_when: false
  failed_when: false
  become: false

- name: Display uv version
  ansible.builtin.debug:
    msg: "uv installed: {{ uv_version_check.stdout }}"
  when: uv_version_check.rc == 0

# Final Python Ecosystem Verification
- name: Verify Python ecosystem is functional
  ansible.builtin.assert:
    that:
      - python_version_check.rc == 0
      - uv_version_check.rc == 0
    fail_msg: "Python ecosystem installation failed"
    success_msg: "Python {{ python_version }} + uv package manager installed successfully"
