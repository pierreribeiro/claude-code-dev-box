---
- name: Check if Homebrew is already installed
  stat:
    path: "{{ homebrew_bin }}/brew"
  register: homebrew_check
  become: no

- name: Download Homebrew installation script
  get_url:
    url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
    dest: /tmp/homebrew-install.sh
    mode: '0755'
  when: not homebrew_check.stat.exists
  become: no

- name: Install Homebrew
  shell: |
    NONINTERACTIVE=1 /bin/bash /tmp/homebrew-install.sh
  args:
    creates: "{{ homebrew_bin }}/brew"
  when: not homebrew_check.stat.exists
  become: no

- name: Remove installation script
  file:
    path: /tmp/homebrew-install.sh
    state: absent
  when: not homebrew_check.stat.exists

- name: Add Homebrew to PATH for current session
  shell: |
    eval "$({{ homebrew_bin }}/brew shellenv)"
  args:
    executable: /bin/bash
  become: no
  changed_when: false

- name: Add Homebrew to user shell configuration
  lineinfile:
    path: "{{ dev_home }}/.bashrc"
    line: 'eval "$({{ homebrew_bin }}/brew shellenv)"'
    create: yes
  become: no

- name: Verify Homebrew installation
  command: "{{ homebrew_bin }}/brew --version"
  register: brew_version
  changed_when: false
  become: no

- name: Display Homebrew version
  debug:
    msg: "Homebrew installed: {{ brew_version.stdout_lines[0] }}"
