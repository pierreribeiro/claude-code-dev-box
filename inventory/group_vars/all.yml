---
# WSL2 DevEnv Configuration Variables
# Version: 1.2.0 (Updated for Privilege Escalation Fix)

# User Configuration
# NOTE: These are overridden in playbook pre_tasks to handle privilege escalation
# When running with sudo, real_user and real_home capture the actual user
dev_user: "{{ ansible_user_id }}"  # Fallback: current user
dev_home: "{{ ansible_env.HOME }}"  # Fallback: current home
dev_email: "pierre.ribeiro@gmail.com"
dev_name: "Pierre Ribeiro"

# System Configuration
ubuntu_version: "24.04"
system_timezone: "America/Sao_Paulo"

# Feature Flags (enable/disable components)
install_system_packages: true
install_homebrew: true
install_core_tools: true

# Phase 4: Language Runtimes
install_python_stack: true
install_nodejs_stack: true
install_bun: true
install_rust_stack: true

# Future Phases
install_cloud_providers: false
install_iac_tools: false
install_database_clients: false
install_oracle_client: false
install_shell_config: false
install_productivity_tools: false
install_ai_stack: false

# Paths
homebrew_path: "/home/linuxbrew/.linuxbrew"
homebrew_bin: "{{ homebrew_path }}/bin"
oracle_client_path: "/opt/oracle"

# Shell Configuration
shell_type: "zsh"
install_oh_my_zsh: true

# Git Configuration
git_user_name: "{{ dev_name }}"
git_user_email: "{{ dev_email }}"
git_default_branch: "main"
git_editor: "code --wait"
