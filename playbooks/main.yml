---
- name: WSL2 Ubuntu Development Environment Setup
  hosts: localhost
  gather_facts: yes
  become: yes
  
  vars_files:
    - ../inventory/group_vars/all.yml
  
  pre_tasks:
    # PRIVILEGE ESCALATION FIX: Capture real user before privilege escalation
    - name: Capture real user information
      set_fact:
        real_user: "{{ lookup('env', 'SUDO_USER') | default(ansible_user_id) }}"
        real_home: "{{ lookup('env', 'HOME') }}"
      become: no
      tags: [always]

    - name: Override user variables with real user
      set_fact:
        dev_user: "{{ real_user }}"
        dev_home: "{{ real_home }}"
      tags: [always]

    - name: Display environment information
      debug:
        msg:
          - "Setting up development environment for {{ dev_user }}"
          - "Home directory: {{ dev_home }}"
          - "Ubuntu version: {{ ubuntu_version }}"
          - "Real user captured: {{ real_user }}"
      tags: [always]
    
    - name: Verify Ubuntu version
      assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == ubuntu_version
        fail_msg: "This playbook requires Ubuntu {{ ubuntu_version }}"
        success_msg: "Ubuntu version check passed"
      tags: [always]
  
  roles:
    - role: system_preparation
      when: install_system_packages | bool
      tags: [phase1, system]

    - role: homebrew
      when: install_homebrew | bool
      tags: [phase2, homebrew]

    - role: core_tools
      when: install_core_tools | bool
      tags: [phase3, core-tools]

    - role: language_runtimes
      when: install_python_stack | bool or install_nodejs_stack | bool or install_rust_stack | bool or install_bun | bool
      tags: [phase4, languages, runtimes]

  post_tasks:
    - name: Display completion message
      debug:
        msg:
          - "✅ Development environment setup complete!"
          - "Next phase: Run with --tags phase5 for cloud providers"
      tags: [always]
